<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101318">
<title>Блэкгрумер — оставить отзыв</title>
<style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 5%,#28303a 0%,#15191f 48%,#0d1014 100%);color:#fff;display:grid;place-items:center;padding:24px 18px}.card{width:min(100%,420px);padding:44px 24px 30px;background:linear-gradient(150deg,#242a32,#171b20);border:1px solid #3a414a;border-radius:28px;text-align:center;box-shadow:0 24px 65px #0008}.mark{width:70px;height:70px;border:1px solid #7d8995;border-radius:22px;margin:0 auto 24px;display:grid;place-items:center;font-size:34px}h1{font-size:30px;letter-spacing:.015em;margin:0 0 9px;font-weight:800}address{font-size:14px;color:#adb6c0;font-style:normal;margin:0 0 33px}.headline{font-size:22px;line-height:1.3;font-weight:750;margin:0 0 12px}.desc{font-size:15px;line-height:1.55;color:#b9c2cc;margin:0 auto 27px;max-width:310px}.buttons{display:grid;gap:13px}a.button{display:flex;align-items:center;justify-content:center;gap:11px;min-height:62px;border-radius:15px;font-weight:750;font-size:16px;text-decoration:none;transition:transform .15s,filter .15s}a.button:active{transform:scale(.98)}.yandex{background:#ffdc3c;color:#161616}.gis{background:#39b76c;color:#fff}.dot{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:#0002;font-weight:900}.footer{color:#85909d;font-size:12px;margin:27px 0 0;line-height:1.5}@media(max-width:360px){.card{padding:34px 17px 25px}h1{font-size:27px}.headline{font-size:20px}a.button{font-size:15px}}
</style>
</head>
<body>
<main class="card">
<div class="mark" aria-hidden="true">✦</div>
<h1>БЛЭКГРУМЕР</h1>
<address>ул. Крузенштерна, 4</address>
<p class="headline">Поделитесь впечатлением</p>
<p class="desc">Спасибо, что выбрали нас! Ваш отзыв поможет нам стать ещё лучше.</p>
<div class="buttons">
<a class="button yandex" href="https://yandex.ru/maps/org/blekgrumer/161219448538?si=g3z5xkuqg88dn3ga3r81hrdf0w" target="_blank" rel="noopener noreferrer"><span class="dot">Я</span>Оставить отзыв в Яндексе ↗</a>
<a class="button gis" href="https://2gis.ru/moscow/geo/70000001104538834" target="_blank" rel="noopener noreferrer"><span class="dot">2</span>Оставить отзыв в 2ГИС ↗</a>
</div>
<p class="footer">Выберите удобный сервис для отзыва</p>
</main>
</body>
</html>
